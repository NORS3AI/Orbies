<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Orbies — a cozy incremental idle & gacha game. Break rocks, earn coins, summon and collect tiny creatures, farm, and climb the arena leaderboards." />
  <meta name="theme-color" content="#12101f" />
  <title>Orbies — Idle Creature Collector</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-orb">🔮</span>
        <span class="brand-name">Orbies</span>
      </div>
      <div class="resources">
        <div class="res" title="Gold — earned from mining"><span class="res-ico">🪙</span><span id="resGold">0</span></div>
        <div class="res" title="Gems — used to summon"><span class="res-ico">💎</span><span id="resGems">0</span></div>
        <div class="res" title="Food — level up Orbies"><span class="res-ico">🍖</span><span id="resFood">0</span></div>
        <div class="res" title="Dust — open ring packs"><span class="res-ico">✨</span><span id="resDust">0</span></div>
      </div>
    </header>

    <nav id="tabBar" class="tab-bar"></nav>

    <main id="tabContent" class="tab-content"></main>

    <div id="toasts" class="toasts"></div>
  </div>

  <!-- Classic scripts, ordered by dependency (also works from file://). -->
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
